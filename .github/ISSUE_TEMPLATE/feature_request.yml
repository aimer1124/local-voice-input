name: ✨ Feature Request
description: 提一个新功能或改进建议 / Suggest a new feature or improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你希望解决的问题以及期望的行为。
        Thanks for the suggestion! Please describe the problem and your expected behavior.

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？/ What problem does this solve?
      placeholder: |
        当前我每次录音前都要手动检查 Ollama 是否在跑，希望脚本能自动检测并启动。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案 / Proposed solution
      placeholder: |
        在 vinput_bg.sh 开头加 `pgrep -x ollama || ollama serve &` 这种自启逻辑。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives considered
      description: 你想过的其他实现方式（可选）
      placeholder: |
        也考虑过用 launchd 配置开机自启 Ollama，但那需要修改用户系统。

  - type: dropdown
    id: priority
    attributes:
      label: 优先级 / Priority
      options:
        - "Nice to have - 锦上添花"
        - "Important - 重要"
        - "Critical - 阻塞使用"
      default: 0
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 贡献意愿 / Willing to contribute?
      options:
        - label: 我愿意提 PR 实现这个功能 / I'd like to implement this myself
