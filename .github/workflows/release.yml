name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build HUD and attach to release
    runs-on: macos-14         # Apple Silicon (arm64)
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 需要 tag 历史来生成 compare 链接

      - name: Show toolchain
        run: |
          echo "Runner arch: $(uname -m)"
          swiftc --version
          xcodebuild -version

      - name: Build HUD (optimized arm64 binary)
        run: |
          swiftc -O src/hud.swift -o hud
          file hud
          lipo -archs hud
          ls -lh hud

      - name: Compute SHA256
        run: |
          shasum -a 256 hud | tee hud.sha256

      - name: Extract CHANGELOG section for this tag
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # 把 v1.2.0 → 1.2.0，再从 CHANGELOG.md 中抠出 "## [1.2.0]" ~ 下一个 "## [" 之间的内容
          VER="${TAG#v}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$VER" '
            $0 ~ "^## \\["ver"\\]" {p=1; next}
            p && /^## \[/         {exit}
            p                     {print}
          ' CHANGELOG.md | sed '/^---$/,$d' > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "⚠ No CHANGELOG section found for $VER, falling back to auto notes"
            echo "no-changelog-section=1" >> "$GITHUB_OUTPUT"
          else
            echo "▶ Extracted $(wc -l < "$NOTES_FILE") lines for $VER"
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s\n' \
              "${{ github.repository }}" \
              "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "HEAD")...$TAG" >> "$NOTES_FILE"
            echo "no-changelog-section=0" >> "$GITHUB_OUTPUT"
          fi
          echo "notes-file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create release (if missing) and upload binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.notes.outputs.notes-file }}
          NO_CHANGELOG: ${{ steps.notes.outputs.no-changelog-section }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "▶ Creating new release $TAG"
            if [ "$NO_CHANGELOG" = "1" ]; then
              gh release create "$TAG" --title "$TAG" --generate-notes
            else
              gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
            fi
          else
            echo "▶ Release $TAG already exists — refreshing notes from CHANGELOG"
            if [ "$NO_CHANGELOG" = "0" ]; then
              gh release edit "$TAG" --notes-file "$NOTES_FILE"
            fi
          fi

          # --clobber 允许覆盖同名旧附件（重跑 workflow 时安全）
          gh release upload "$TAG" hud hud.sha256 --clobber

          echo ""
          echo "✅ Release URL: $(gh release view "$TAG" --json url --jq .url)"
